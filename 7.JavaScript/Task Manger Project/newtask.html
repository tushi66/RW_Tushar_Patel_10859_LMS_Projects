    <link rel="stylesheet" href="./CSS/style.css">

</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
              <a class="navbar-brand" href="#">Navbar</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./displaytasks.html">Display Tasks</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./newtask.html">ADD New Task</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="./edittask.html">Edit Data</a>
                  </li>
                 
                </ul>
                <form class="d-flex" role="search">
                  <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                  <button class="btn btn-outline-success" type="submit">Search</button>             </form> 
                </div>
            </div>
            </nav>

    </header>

    <main>
        <div class="container">
            <div class="row justify-content-center mainform">

                <h1 class="text-center mb-5">Task Management System</h1>

                <form action="" onsubmit="return validateForm()">
                    <div class="mb-3">
                        <lable for="taskName" class="form-label">Task Name</lable>
                        <input type="text" class="mb-3 input inputname" placeholder="Task Name">
                        <div id="errorname" class="error"></div>
                    </div>

                    <div class="mb-3">
                        <lable for="taskDescription" class="form-label">Task Description</lable>
                        <input type="text" class="mb-3 input inputdescription" placeholder="Task Description">
                        <div id="errordescription" class="error"></div>
                    </div>

                    <div class="mb-3">
                        <lable for="dueDate" class="form-label">Due Date</lable>
                        <input type="date" class="mb-3 input inputduedate" placeholder="Due Date">
                          <div id="errorduedate" class="error"></div>
                    </div>

                    <div class="mb-3">
                        <lable for="priority" class="form-label">Priority</lable>
                        <select class="mb-3 input inputpriority" aria-label="Default select example">
                            <option selected>Open this select menu</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                          </select>
                          <div id="errorpriority" class="error"></div>
                    </div>

                    <button class="btn btn-primary w-100" type="submit" onclick="addTask()">Add Task</button> 



                </form>
            </div>
            



    </main>

    <footer>
       
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
